name: Deploy to EC2

# Every push to master goes live on web-shared-1 as web@insurance (port 3002, behind Caddy).
# Runtime env lives on the server in /srv/insurance/.env; this job ships code only.
# DEPLOY_TOKEN can only run /usr/local/bin/deploy-node for this site (HTTPS deploy endpoint; port 22 is closed),
# which restarts the app, checks it answers, and rolls back if it does not.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package standalone release
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar -czf release.tgz --exclude='./.env*' -C .next/standalone .

      - name: Ship to web-shared-1
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -sS --fail-with-body -H "Authorization: Bearer $DEPLOY_TOKEN" -H "X-Release-Id: $GITHUB_SHA" --data-binary @release.tgz https://deploy.leadmailer.ai/insurance
